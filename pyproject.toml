[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnndenoiser"
version = "0.1.2"
description = "Deep-learning denoiser for XPS (X-ray photoelectron spectroscopy) spectra"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Satoshi Toyoda" }]
keywords = ["XPS", "denoising", "spectroscopy", "neural network", "PyTorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
# Every entry has an importer in the shipped package, the CLI, the tests or the
# reference benchmark. Two more were declared once for modules that are not part
# of this distribution and are not listed here.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "h5py>=3.8",
]

[project.urls]
Homepage = "https://github.com/stoyoda0012-cyber/dnndenoiser"
Repository = "https://github.com/stoyoda0012-cyber/dnndenoiser"
Documentation = "https://github.com/stoyoda0012-cyber/dnndenoiser/blob/main/docs/README.md"
Changelog = "https://github.com/stoyoda0012-cyber/dnndenoiser/blob/main/CHANGELOG.md"
# The concept DOI, which always resolves to the latest archived release.
Archive = "https://doi.org/10.5281/zenodo.22867628"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
dnndenoiser = "dnndenoiser.cli:main"

# All library code lives under the `dnndenoiser` package in a `src/` layout.
# `benchmarks` and `tests` sit outside `src/`, so package discovery never sees
# them and they are not distributed as importable library packages.
[tool.setuptools.packages.find]
where = ["src"]
include = ["dnndenoiser*"]

# The lock (`uv.lock`) pins the environment benchmark records are made in -- not what
# users get: `pip install dnndenoiser` reads only [project].dependencies, which are
# lower bounds, and never sees this table. The versions match the `environment` of the
# P2-A record. A record made under different versions is a different measurement; see
# docs/VERIFICATION.md. The lock is restricted to the platform those records are made
# on, because numpy 2.3.3 and scipy 1.16.3 do not support Python 3.10 and a universal
# lock for requires-python >= 3.10 would not resolve.
[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
]
constraint-dependencies = [
    "torch==2.9.1",
    "numpy==2.3.3",
    "scipy==1.16.3",
    "h5py==3.14.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E+F are enforced and clean. Candidates for a follow-up cleanup, mostly
# auto-fixable: I (isort), B (bugbear), UP (pyupgrade), W (pycodestyle warnings).
select = ["E", "F"]
ignore = [
    "E501", # line too long — not enforced
]

[tool.pytest.ini_options]
testpaths = ["tests"]
