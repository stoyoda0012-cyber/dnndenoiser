name: CI

# Pinned to commit SHAs, not tags: a tag is a movable pointer, so `@v4` means
# "whatever that repository decides v4 is when CI next runs". The trailing
# comment records which release each SHA was, since the SHA alone is unreadable.
# openjournals-draft-action had no release to pin to at all -- it was on @master.

# Read-only by default. No job here needs to write to the repository, and a job
# that ever does has to say so, in this file, where it can be seen.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Layout-robust CI for the src/dnndenoiser package.
# CUDA cannot run on GitHub-hosted runners; the GPU path is exercised on an
# NVIDIA machine or a self-hosted GPU runner.
#
# macOS is opt-in. The macOS matrix runs on workflow_dispatch only — never on
# push or pull request — and there is no scheduled macOS run. Trigger it from
# the Actions tab ("Run workflow") or with `gh workflow run ci.yml`.
#
# Windows runs on every push and pull request. A cp932 (Japanese Windows) locale
# broke the suite through open()/read_text() calls without `encoding`, which a
# UTF-8 runner cannot see; the runner's own locale is cp1252, so the test job
# also sets PYTHONWARNDEFAULTENCODING=1, which together with the filter in
# pyproject.toml fails such a call on every OS.

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    name: pytest + CLI smoke (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # See the note at the top of this file: push and PR run Linux and
        # Windows; macOS is opt-in via the Actions tab ("Run workflow") or
        # `gh workflow run ci.yml`.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
        python-version: ["3.10", "3.12"]

    env:
      PYTHONWARNDEFAULTENCODING: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch first (avoid multi-GB CUDA wheels on Linux)
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite (incl. import-boundary)
        run: pytest -q

      # bash on every OS (Git Bash on Windows) and RUNNER_TEMP rather than /tmp,
      # so the same script runs everywhere. PYTHONWARNINGS names the CLI module
      # exactly: `evaluate -o` writes JSON, and no pytest test reaches it.
      - name: CLI end-to-end smoke (generate -> train -> infer -> evaluate, CPU)
        shell: bash
        env:
          PYTHONWARNINGS: "error::EncodingWarning:dnndenoiser.cli"
        run: |
          T="$RUNNER_TEMP"
          dnndenoiser --help
          dnndenoiser generate -o "$T/smoke.h5" -n 32 --peak-set C1s_single
          dnndenoiser train -d "$T/smoke.h5" -o "$T/smoke.pt" \
            --arch FCNN --epochs 1 --batch-size 16 --device cpu
          dnndenoiser infer -d "$T/smoke.h5" -m "$T/smoke.pt" \
            -o "$T/smoke_out.h5" --batch-size 16 --device cpu
          dnndenoiser evaluate -d "$T/smoke_out.h5" -o "$T/smoke_metrics.json"

  build:
    name: build + archive-cleanliness + clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build -o dist/

      - name: Assert archives contain no research or local-agent files
        run: |
          set -e
          tar tzf dist/*.tar.gz > sdist_contents.txt
          python -c "import zipfile,glob; print('\n'.join(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()))" > wheel_contents.txt

          # Do not use `! grep` here. Commands in a negated condition are
          # exempt from `set -e`, so a match can be printed without failing
          # the step. Accumulate violations and fail explicitly instead.
          fail=0
          deny() {  # deny <description> <extended-regex>
            if grep -iE "$2" sdist_contents.txt wheel_contents.txt; then
              echo "::error::$1 must not ship (pattern: $2)"
              fail=1
            fi
          }

          deny "Research layers and app code" \
               '(^|/)(experiments|benchmarks|gui|save|docs)/'
          deny "Local agent/control files" \
               'AGENTS\.md|CLAUDE'

          # A deny-list cannot protect an archive if its contents listing was
          # not generated. Keep this check adjacent to the deny rules.
          for listing in sdist_contents.txt wheel_contents.txt; do
            if ! grep -q '[^[:space:]]' "$listing"; then
              echo "::error::$listing is empty — archive listing failed"
              fail=1
            fi
          done

          [ "$fail" -eq 0 ] || exit 1
          echo "archive contents clean"

      - name: Install built wheel into a clean venv and smoke-test
        run: |
          python -m venv /tmp/cleanenv
          /tmp/cleanenv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/cleanenv/bin/pip install dist/*.whl
          /tmp/cleanenv/bin/python -c "
          import torch
          from dnndenoiser.models.network import DenoisingNetwork
          m = DenoisingNetwork(num_features=256, num_hidden_units=100,
                               layer_type='FCNN', encoder_output_dim=64)
          out = m(torch.zeros(2, 256))
          out = out[0] if isinstance(out, tuple) else out
          assert out.shape == (2, 256)
          print('clean-install smoke OK')
          "
          /tmp/cleanenv/bin/dnndenoiser --help

      - name: Validate CITATION.cff
        run: pipx run cffconvert --validate

  paper:
    name: JOSS paper compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c  # master as of 2026-09-22
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: joss-paper
          path: paper/paper.pdf
